name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    env:
      APP_NAME: Reflex
      BUNDLE_ID: com.reflex.app
      LANDING_REPO: Oluwaseunus/reflex-landing-page
      # Job-scoped so every `swift build` step sees the same client id. If
      # scoped to just the first build, the post-accessor-patch rebuild would
      # regenerate SpotifySecrets.swift with an empty env var and bake an
      # empty client id into the binary.
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (release)
        run: |
          set -euo pipefail
          if [ -z "${SPOTIFY_CLIENT_ID:-}" ]; then
            echo "::error::SPOTIFY_CLIENT_ID secret is not set — release builds must include it or Spotify support will be disabled."
            exit 1
          fi
          chmod +x Scripts/generate-spotify-secrets.sh
          Scripts/generate-spotify-secrets.sh
          swift build --configuration release --arch arm64 --arch x86_64

      - name: Patch Bundle.module accessors and rebuild
        run: |
          set -euo pipefail
          # SPM's generated Bundle.module resolves via Bundle.main.bundleURL.
          # For a packaged .app that points at the .app root, where SPM package
          # bundles (e.g. KeyboardShortcuts localizations) are not staged —
          # loading them would fail at runtime. Rewrite the accessor to resolve
          # under Bundle.main.resourceURL (Contents/Resources/) and relink.
          NEEDLE='Bundle.main.bundleURL.appendingPathComponent'
          REPLACEMENT='(Bundle.main.resourceURL ?? Bundle.main.bundleURL).appendingPathComponent'
          PATCHED_ANY=0
          while IFS= read -r -d '' accessor; do
            if grep -qF "$REPLACEMENT" "$accessor"; then continue; fi
            if grep -qF "$NEEDLE" "$accessor"; then
              sed -i '' "s|${NEEDLE}|${REPLACEMENT}|g" "$accessor"
              PATCHED_ANY=1
            fi
          done < <(find .build -name "resource_bundle_accessor.swift" -print0)
          if [ "$PATCHED_ANY" -eq 1 ]; then
            swift build --configuration release --arch arm64 --arch x86_64
          fi

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          BUILD_DIR=".build/apple/Products/Release"
          if [ ! -f "$BUILD_DIR/$APP_NAME" ]; then
            BUILD_DIR=".build/release"
          fi
          APP_BUNDLE="build/$APP_NAME.app"
          rm -rf build && mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp "$BUILD_DIR/$APP_NAME" "$APP_BUNDLE/Contents/MacOS/"
          if [ -d "$BUILD_DIR/${APP_NAME}_${APP_NAME}.bundle" ]; then
            cp -R "$BUILD_DIR/${APP_NAME}_${APP_NAME}.bundle/"* "$APP_BUNDLE/Contents/Resources/"
          fi
          # Stage third-party SPM resource bundles (e.g. KeyboardShortcuts)
          # under Contents/Resources so the patched Bundle.module accessor
          # resolves them at runtime.
          for pkg_bundle in "$BUILD_DIR"/*.bundle; do
            [ -d "$pkg_bundle" ] || continue
            name=$(basename "$pkg_bundle")
            if [ "$name" != "${APP_NAME}_${APP_NAME}.bundle" ]; then
              cp -R "$pkg_bundle" "$APP_BUNDLE/Contents/Resources/"
            fi
          done
          VERSION="0.1.${{ github.run_number }}"
          cat > "$APP_BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>$APP_NAME</string>
              <key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>$APP_NAME</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>$VERSION</string>
              <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
              <key>LSUIElement</key><true/>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
              <key>NSAppleEventsUsageDescription</key><string>Reflex needs to send AppleScript commands to control media playback in your music apps.</string>
              <key>NSHumanReadableCopyright</key><string>Copyright © $(date +%Y).</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          EOF
          codesign --force --sign - "$APP_BUNDLE"

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p dist dmg-staging
          cp -R "build/$APP_NAME.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dmg-staging -ov -format UDZO "dist/$APP_NAME.dmg"

      - name: Publish release to landing page repo
        env:
          GH_TOKEN: ${{ secrets.LANDING_PAGE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="v0.1.${{ github.run_number }}"
          gh release create "$VERSION" "dist/$APP_NAME.dmg" \
            --repo "$LANDING_REPO" \
            --title "Reflex $VERSION" \
            --notes "Automated build from ${{ github.repository }}@${{ github.sha }}" \
            --latest
